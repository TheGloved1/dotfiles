# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# This is where you put your own keybinds. Be Mindful to check as well ~/.config/hypr/configs/Keybinds.conf to avoid conflict
# if you think I should replace the Pre-defined Keybinds in ~/.config/hypr/configs/Keybinds.conf , submit an issue or let me know in DC and present me a valid reason as to why, such as conflicting with global shortcuts, etc etc

# See https://wiki.hyprland.org/Configuring/Keywords/ for more settings and variables
# See also Laptops.conf for laptops keybinds 

# /* ---- ✴️ Variables ✴️ ---- */  #
$mainMod = SUPER
$scriptsDir = $HOME/.config/hypr/scripts
$UserScripts = $HOME/.config/hypr/UserScripts
$UserConfigs = $HOME/.config/hypr/UserConfigs

#  IMPORTANT: If you want to remap and existing keybind you MUST unbindd it first 

# The bindings are CASE SENSITIVE. We suggest you copy the exisitng binding here
#  Then change `bindd` to `unbind`

# E.g. 
# unbind = $mainMod, Return, Open terminal, exec, $term
# bindd = $mainMod, Return, Open terminal, exec, ghostty 
#
# unbind = $mainMod, E, file manager, exec, $files
# bindd = $mainMod, T, file manager, exec, $files

# If you are ADDING a bindd, make sure you include the description 
# Other the keybind search menu might not show it properly 

# E.g.
# bindd = $mainMod, Z, My z app, exec APPNAME

##############
#  unbinds   #
##############

# Unbind resize on $mainMod SHIFT + arrows (conflicts with move window)
unbind = $mainMod SHIFT, left
unbind = $mainMod SHIFT, right
unbind = $mainMod SHIFT, up
unbind = $mainMod SHIFT, down

# Unbind system $mainMod + A/F (rebinding to workspace move)
unbind = $mainMod, A
unbind = $mainMod, F

# Unbind arrow focus keys (rebinding to HJKL)
unbind = $mainMod, left
unbind = $mainMod, right
unbind = $mainMod, up
unbind = $mainMod, down

# Unbind H/J/K (rebinding to focus)
unbind = $mainMod, H
unbind = $mainMod, J
unbind = $mainMod, K

# Unbind D and SPACE (swapping)
unbind = $mainMod, D
unbind = $mainMod, SPACE


##############
#  Rebinds   #
##############

bindd = ALT, SPACE, Toggle vicinae, exec, vicinae toggle

# Move window in direction (crosses displays)
bindd = $mainMod SHIFT, left, Move window left, movewindow, l
bindd = $mainMod SHIFT, right, Move window right, movewindow, r
bindd = $mainMod SHIFT, up, Move window up, movewindow, u
bindd = $mainMod SHIFT, down, Move window down, movewindow, d
bindd = $mainMod SHIFT, H, Move window left, movewindow, l
bindd = $mainMod SHIFT, L, Move window right, movewindow, r
bindd = $mainMod SHIFT, K, Move window up / prev workspace, exec, $scriptsDir/MoveWrap.sh u
bindd = $mainMod SHIFT, J, Move window down / next workspace, exec, $scriptsDir/MoveWrap.sh d

# Move workspace across displays ($mainMod + ASDF)
bindd = $mainMod, A, Move workspace left, movecurrentworkspacetomonitor, l
bindd = $mainMod, F, Move workspace right, movecurrentworkspacetomonitor, r

# Displaced app rebinds
bindd = $mainMod CTRL, A, Desktop overview, exec, $scriptsDir/OverviewToggle.sh
bindd = $mainMod CTRL, F, Maximize window, fullscreen, 1

# Swapped D and SPACE
bindd = $mainMod, D, Toggle float, togglefloating,
bindd = $mainMod, SPACE, App launcher, exec, pkill rofi || true; $scriptsDir/RofiFocusedWallpaperLink.sh >/dev/null 2>&1 || true; rofi -show drun -modi drun,filebrowser,run,window

# VIM-style window focus (replaces arrows)
bindd = $mainMod, H, Focus left, exec, $scriptsDir/LayoutKeybindDispatch.sh focus-left
bindd = $mainMod, J, Focus down / next workspace, exec, $scriptsDir/FocusWrap.sh d
bindd = $mainMod, K, Focus up / prev workspace, exec, $scriptsDir/FocusWrap.sh u
bindd = $mainMod, L, Focus right, exec, $scriptsDir/LayoutKeybindDispatch.sh focus-right

# Help menu moved from $mainMod + H
bindd = $mainMod, slash, Help / cheat sheet, exec, $scriptsDir/KeyHints.sh

# Cycle next/prev moved from $mainMod + J/K
bindd = $mainMod, bracketleft, Cycle next (layout-aware), exec, $scriptsDir/LayoutKeybindDispatch.sh cycle-next
bindd = $mainMod, bracketright, Cycle previous (layout-aware), exec, $scriptsDir/LayoutKeybindDispatch.sh cycle-prev


# Color picker (unbind pseudo toggle conflict)
unbind = $mainMod, P
bindd = $mainMod, P, Color picker, exec, hyprpicker -a -f hex --lowercase-hex

# For passthrough keyboard into a VM
# bind = $mainMod ALT, P, submap, passthru
#submap = passthru
# to unbind
#bind = $mainMod ALT, P, submap, reset
#submap = reset
