    community_ids = [
        "opencode",
        "zen-browser",
        "discord",
        "gimp",
        "neovim",
        "heroiclauncher",
        "prismlauncher",
        "steam",
        "rofi",
        "vicinae",
        "fastfetch",
        "hyprtoolkit",
        "papirus-icons",
        "lazygit",
        "yazi"
