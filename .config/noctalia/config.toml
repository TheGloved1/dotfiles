[audio]
enable_overdrive = true
enable_sounds = true
sound_volume = 0.29999999329447746

[bar.default]
background_opacity = 0.89999997988343239
border = "outline"
capsule = true
capsule_thickness = 0.71999998763203621
center = [ "active_window" ]
end = [ "recorder", "group:g2", "brightness", "battery", "weather", "clock", "control-center", "session" ]
font_family = "CaskaydiaCove Nerd Font"
font_weight = 400
margin_ends = 0
margin_opposite_edge = 2
padding = 6
panel_overlap = 0
radius = 32
shadow = false
start = [ "launcher", "group:g1", "tray", "group:g3", "cat" ]

    [bar.default.dead_zone.actions]
    left = "panel-toggle control-center home"
    middle = "settings-toggle bar"
    right = "settings-toggle"

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "workspaces", "taskbar" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "notifications", "network", "bluetooth", "volume" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g3"
    members = [ "ram", "cpu" ]
    opacity = 1.0
    padding = 6.0

[brightness]
enable_ddcutil = true
minimum_brightness = 0.39999999105930328
sync_all_monitors = true

[control_center]
width = 800

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = [ "desktop-widget-0000000000000001" ]

    [desktop_widgets.grid]
    cell_size = 8
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 144.0
    box_width = 304.0
    cx = 1752.0
    cy = 124.0
    output = "HDMI-A-1"
    rotation = 0.0
    type = "clock"

[dock]
active_monitor_only = true
background_opacity = 0.7799999825656414
enabled = true
launcher_position = "start"
margin_edge = 8
pinned = [ "steam", "equibop", "zen", "kitty" ]
radius = 24
reserve_space = false
show_dots = true
show_instance_count = false
show_running = false
smart_auto_hide = true

[hot_corners]
enabled = false

    [hot_corners.bottom_left]
    action = "none"

    [hot_corners.bottom_right]
    action = "none"
    command = ""

    [hot_corners.top_left]
    action = "none"

    [hot_corners.top_right]
    action = "none"

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]
pre_action_fade_seconds = 30

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 750.0

[keybinds]
down = [ "Down", "Ctrl+j" ]
left = [ "Left", "Ctrl+h" ]
right = [ "Right", "Ctrl+l" ]
up = [ "Up", "Ctrl+k" ]

[location]
auto_locate = true

[lockscreen]
blurred_desktop = true
fingerprint = false

[lockscreen_widgets]
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "HDMI-A-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = true
force = true
temperature_day = 5100
temperature_night = 4600

[notification]
background_opacity = 0.89999997988343239
layer = "overlay"
offset_x = 6
offset_y = 4

[osd]
background_opacity = 0.89999997988343239
offset_x = 4
offset_y = 4

[plugin_settings."alexander/screen-toolkit"]
search-engine-url = "https://duckduckgo.com/?q="
x02-expiry = "1h"

[plugin_settings."kenn/keybind-cheatsheet"]
cheatsheet_open_near_click = false
cheatsheet_placement = "attached"
columns = 2
hyprland_parser = "lua"
show_actions = true

[plugin_settings."noctalia/screen_recorder"]
replay_duration = 60
replay_enabled = true
resolution = "1280x720"
restore_portal = true
video_source = "focused"

[plugin_settings."tadomika_ari/config-swap"]
panel_placement = "attached"

[plugin_settings."weinguyen/shell-command"]
snippets = [ "notify-send \"Test\"" ]

[plugins]
enabled = [
    "tadomika_ari/config-swap",
    "noctalia/bongocat",
    "noctalia/screen_recorder",
    "noctalia/wallhaven",
    "kenn/keybind-cheatsheet",
    "alexander/screen-toolkit",
    "noctalia/timer",
    "weinguyen/shell-command",
    "gloves/screenshot-actions"
]

[shell]
app_icon_color = "primary"
clipboard_auto_paste = "off"
clipboard_history_max_entries = 500
external_ip_enabled = true
font_family = "CaskaydiaCove Nerd Font"
launch_apps_custom_command = "~/.config/noctalia/wrap/noctalia-wrap $CMD"
panel_anchor_bar = "default"
polkit_agent = true

    [shell.greeter_sync]
    auto_sync = false

    [shell.launcher]
    categories = true
    compact = true

        [shell.launcher.providers.emoji]
        global = false

    [shell.panel]
    clipboard_placement = "attached"
    floating_layer = "overlay"
    launcher_placement = "attached"
    launcher_position = "auto"
    polkit_placement = "attached"
    shadow = true
    transparency_mode = "soft"

    [shell.screen_corners]
    enabled = true
    size = 24

    [shell.screenshot]
    confirm_region = true
    directory = "~/Pictures/Screenshots"
    pipe_command = "swappy -f -"

    [shell.session]
    grid = false

        [[shell.session.actions]]
        action = "lock"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "1"
        variant = "default"

        [[shell.session.actions]]
        action = "logout"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "2"
        variant = "default"

        [[shell.session.actions]]
        action = "lock_and_suspend"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "3"
        variant = "default"

        [[shell.session.actions]]
        action = "reboot"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "4"
        variant = "default"

        [[shell.session.actions]]
        action = "shutdown"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "5"
        variant = "destructive"

    [shell.shadow]
    alpha = 0.59999998658895493
    direction = "down_right"

[theme]
builtin = "Dracula"
community_palette = "Tokyo Night Moon"
custom_palette = "dragon-mc"
mode = "dark"
source = "community"
wallpaper_scheme = "soft"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "gtk3", "gtk4", "hyprland", "kcolorscheme", "kitty", "qt", "starship" ]
    community_ids = [
        "opencode",
        "zen-browser",
        "discord",
        "gimp",
        "heroiclauncher",
        "prismlauncher",
        "steam",
        "rofi",
        "vicinae",
        "fastfetch",
        "hyprtoolkit",
        "lazygit",
        "yazi"
    ]

[wallpaper]
fill_mode = "span"
transition_duration = 2000
transition_on_startup = true

    [wallpaper.default]
    path = "/home/gloves/Pictures/Wallpapers/TokyoNight/night/os/arch_00_3840x2160.png"

    [wallpaper.last]
    path = "/home/gloves/Pictures/Wallpapers/TokyoNight/night/os/arch_00_3840x2160.png"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/gloves/Pictures/Wallpapers/TokyoNight/night/os/arch_00_3840x2160.png"

    [[wallpaper.favorite]]
    palette_source = "wallpaper"
    path = "/home/gloves/Pictures/Wallpapers/Catppuccin/dragon.jpg"
    theme_mode = "dark"
    wallpaper_scheme = "soft"

[weather]
unit = "imperial"

[widget.active_window]
capsule_opacity = 0.90000000000000002
capsule_radius = "auto"
icon_size = 16
min_length = 45
title_scroll = "on_hover"

[widget.battery]
enabled = false

[widget.bluetooth]
enabled = false

[widget.brightness]
enabled = false

[widget.cat]
audio_spectrum = true
input_devices = [
    "/dev/input/by-id/usb-Razer_Razer_Cynosa_Chroma-event-kbd",
    "/dev/input/by-id/usb-Razer_Razer_Cynosa_Chroma-if01-event-kbd",
    "/dev/input/by-id/usb-Razer_Razer_Naga_X-event-mouse",
    "/dev/input/by-id/usb-Razer_Razer_Naga_X-if01-event-kbd",
    "/dev/input/by-id/usb-Razer_Razer_Naga_X-if02-event-kbd"
]
tappy_mode = true
type = "noctalia/bongocat:cat"

[widget.clock]
capsule = true
capsule_radius = "auto"
format = "%-I:%M:%S %p  %A, %B %d"

    [widget.clock.actions]
    right = "panel-toggle noctalia/timer:panel"

[widget.control-center]
enabled = false
glyph = "hyprland"

[widget.launcher]
capsule_radius = "auto"
custom_image = "/home/gloves/Pictures/Assets/arch-linux.svg"
font_family = "CaskaydiaCove Nerd Font"
font_weight = 400
scale = 1.6000000000000001

[widget.network]
show_label = false

[widget.ram]
stat = "ram_pct"

[widget.recorder]
enabled = false
type = "noctalia/screen_recorder:recorder"

[widget.taskbar]
hide_empty_workspaces = true
inactive_opacity = 0.80000000000000004
only_active_workspace = true
taskbar_max_width = 754
window_title_max_width = 77

[widget.tray]
hidden = [ "Network", "Blueman" ]

[widget.volume]
show_label = false

[widget.weather]
show_condition = false

[widget.workspaces]
active_pill_size = 2.25
hide_when_empty = true
inactive_pill_size = 1.25
