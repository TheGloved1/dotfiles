[plugin_settings."alexander/screen-toolkit"]
panel-legacy_placement = "attached"
panel_placement = "attached"
record-audio-out = true
result_placement = "attached"
search-engine-url = "https://duckduckgo.com/?q="
x02-expiry = "1h"

[plugin_settings."blackbartblues/keymap"]
niri_config = "~/.config/niri/modules/30-binds.kdl"
panel_placement = "attached"
show_undescribed = false

[plugin_settings."gloves/screenshot-actions"]
actions_placement = "attached"
history_placement = "attached"
ocr-result_placement = "attached"
panel-placement = "attached"

[plugin_settings."kenn/keybind-cheatsheet"]
cheatsheet_open_near_click = false
cheatsheet_placement = "attached"
columns = 2
hyprland_parser = "lua"
show_actions = true
show_undescribed = false

[plugin_settings."noctalia/screen_recorder"]
replay_duration = 60
replay_enabled = true
resolution = "1280x720"
restore_portal = true
video_source = "focused"

[plugin_settings."raycursive/discord-voice"]
panel_open_near_click = false

[plugin_settings."tadomika_ari/config-swap"]
panel_placement = "attached"

[plugin_settings."weinguyen/shell-command"]
snippets = [ "notify-send \"Test\"" ]

[plugins]
auto_update = "all"
enabled = [
    "tadomika_ari/config-swap",
    "noctalia/screen_recorder",
    "noctalia/wallhaven",
    "kenn/keybind-cheatsheet",
    "alexander/screen-toolkit",
    "noctalia/timer",
    "weinguyen/shell-command",
    "gloves/screenshot-actions",
    "blackbartblues/keymap",
    "raycursive/discord-voice",
    "noctalia/bongocat"
]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/TheGloved1/noctalia-screenshot-actions"
    name = "local"

[shell]
app_icon_color = "primary"
clipboard_auto_paste = "off"
clipboard_history_max_entries = 500
external_ip_enabled = true
font_family = "CaskaydiaCove Nerd Font"
launch_apps_custom_command = "~/.config/noctalia/wrap/noctalia-wrap $CMD"
niri_overview_type_to_launch_enabled = false
panel_anchor_bar = "default"
polkit_agent = true

    [shell.greeter_sync]
    auto_sync = false
    privilege_command = ""

    [shell.launcher]
    categories = true
    compact = true
    show_app_actions = true

        [shell.launcher.providers.emoji]
        global = false

    [shell.panel]
    clipboard_placement = "attached"
    floating_layer = "overlay"
    launcher_placement = "attached"
    launcher_position = "auto"
    polkit_placement = "attached"
    polkit_position = "auto"
    shadow = true
    transparency_mode = "soft"

    [shell.screen_corners]
    enabled = true
    size = 24

    [shell.screenshot]
    confirm_region = true
    directory = "~/Pictures/Screenshots"
    pipe_command = "swappy -f -"

    [shell.session]
    grid = false

        [[shell.session.actions]]
        action = "lock"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "1"
        variant = "default"

        [[shell.session.actions]]
        action = "logout"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "2"
        variant = "default"

        [[shell.session.actions]]
        action = "lock_and_suspend"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "3"
        variant = "default"

        [[shell.session.actions]]
        action = "reboot"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "4"
        variant = "default"

        [[shell.session.actions]]
        action = "shutdown"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "5"
        variant = "destructive"

    [shell.shadow]
    alpha = 0.64999998547136784
    direction = "center"

