# Per-app launch overrides for noctalia-wrap.
# Format: appname=command to run [args...]
#   appname is the basename of the launched binary (or the flatpak app id).
#   Lines starting with '#' are ignored.
# Apps without an entry are launched as-is.

steam=/usr/bin/steam --pipewire --enable-features=UseOzonePlatform --ozone-platform=wayland
