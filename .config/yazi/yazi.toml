[mgr]
ratio = [2, 4, 2]
sort_by = "natural"
sort_dir_first = true
show_hidden = true

[opener]
folder = [
  { run = 'hyprctl dispatch exec "[float; size 60% 60%; center 1] nemo" %s', orphan = true, desc = "nemo", for = "linux" },
  { run = '''fish -c "nvim "$1""''', block = true, desc = "neovim", for = "linux" },
  { run = 'kitty --detach nvim %s', orphan = true, desc = "neovim (detached)", for = "linux" },
  { run = '''fish -c "lazygit -p "$1""''', block = true, desc = "lazygit", for = "linux" },
  { run = 'codium %s', orphan = true, desc = "vscodium", for = "linux" },
  { run = 'kitty %s', orphan = true, desc = "kitty", for = "linux" },
  { run = 'xdg-open %s', orphan = true, desc = "xdg-open", for = "linux" },
]

edit = [
	{ run = "$EDITOR %s", block = true, for = "unix" },
]

text = [
  { run = '$EDITOR %s', block = true, desc = "$EDITOR", for = "linux" },
  { run = 'nvim %s', block = true, desc = "neovim", for = "linux" },
  { run = 'kitty --detach nvim %s', block = true, desc = "neovim (detached)", for = "linux" },
  { run = 'codium %s', orphan = true, desc = "vscodium", for = "linux" },
  { run = 'xdg-open %s', orphan = true, desc = "xdg-open", for = "linux" },
]

document = [
  { run = 'xdg-open %s', orphan = true, desc = "xdg-open", for = "linux" },
  { run = 'zathura %s', orphan = true, desc = "zathura", for = "linux" },
  { run = 'libreoffice %s', orphan = true, desc = "libreoffice", for = "linux" },
]

image = [
  { run = 'xdg-open %s', orphan = true, desc = "xdg-open", for = "linux" },
  { run = 'qimgv %s', orphan = true, desc = "qimgv", for = "linux" },
  { run = 'krita %s', orphan = true, desc = "krita", for = "linux" },
  { run = 'satty --filename %s', orphan = true, desc = "satty", for = "linux" },
]
video = [
  { run = 'xdg-open %s', orphan = true, desc = "xdg-open", for = "linux" },
  { run = 'mpv --player-operation-mode=pseudo-gui -- %s', orphan = true, desc = "mpv", for = "linux" },
]
mp4 = [
  { run = 'mpv --player-operation-mode=pseudo-gui -- %s', orphan = true, desc = "mpv", for = "linux" },
  { run = 'xdg-open %s', orphan = true, desc = "xdg-open", for = "linux" },
]
audio = [
  { run = 'xdg-open %s', orphan = true, desc = "xdg-open", for = "linux" },
  { run = 'mpv %s', orphan = true, desc = "mpv", for = "linux" },
]
archive = [
  { run = 'xdg-open %s', orphan = true, desc = "xdg-open", for = "linux" },
  { run = 'xarchiver %s', orphan = true, desc = "xarchiver", for = "linux" },
]
fallback = [
  { run = 'xdg-open %s', orphan = true, desc = "xdg-open", for = "linux" },
]

[open]
rules = [
  { url = "*/", use = "folder" },
  { mime = "folder/*", use = "folder" },

  { url = "*.mp4", use = "mp4" },
  { mime = "video/mp4", use = "mp4" },
  { mime = "text/*", use = "text" },
  { mime = "image/*", use = "image" },
  { mime = "video/*", use = "video" },
  { mime = "application/octet-stream", use = "video" },
  { mime = "audio/*", use = "audio" },
  { mime = "inode/x-empty", use = "text" },
  { mime = "application/json", use = "text" },

  { mime = "application/zip", use = "archive" },
  { mime = "application/gzip", use = "archive" },
  { mime = "application/x-bzip", use = "archive" },
  { mime = "application/x-bzip2", use = "archive" },
  { mime = "application/x-tar", use = "archive" },
  { mime = "application/x-7z-compressed", use = "archive" },
  { mime = "application/x-rar", use = "archive" },
  { mime = "application/pdf", use = "document" },
  { mime = "application/epub+zip", use = "document" },
  { mime = "application/x-mobipocket-ebook", use = "document" },

  { mime = "*", use = "fallback" },
]

[[plugin.prepend_fetchers]]
id = "git"
name = "*"
url = "*"
run = "git"
group = "default"

[[plugin.prepend_fetchers]]
id = "git"
name = "*/"
url = "*/"
run = "git"
group = "default"
